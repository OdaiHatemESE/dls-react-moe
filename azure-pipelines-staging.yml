trigger:
  branches:
    include:
      - staging-release

variables:
  NODE_VERSION: '20.x'
  DEPLOY_PATH: 'C:\inetpub\wwwroot\SuperParent\Adeed'
  APP_NAME: 'PPApp-st'

stages:
  - stage: DeployServer1
    displayName: 'Deploy to Server 1'
    jobs:
      - deployment: DeployServer1
        displayName: 'Deploy to Server 1'
        environment: 
          name: 'Staging-Server-1'
          resourceName: 'MOESTGPARPOTN01'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  clean: false
                  fetchDepth: 1

                - task: PowerShell@2
                  displayName: 'Pull latest from staging-release & rebuild'
                  inputs:
                    targetType: 'inline'
                    script: |
                      function Get-Pm2Command {
                        try {
                          $pm2Cmd = (Get-Command pm2.cmd -ErrorAction Stop).Source
                          return $pm2Cmd
                        } catch {
                          $candidates = @()
                          if ($env:APPDATA) {
                            $candidates += (Join-Path $env:APPDATA "npm\pm2.cmd")
                          }
                          try {
                            $prefix = npm config get prefix 2>$null
                            if ($prefix) {
                              $candidates += (Join-Path $prefix "pm2.cmd")
                            }
                          } catch {}
                          $candidates += "C:\Program Files\nodejs\pm2.cmd"
                          foreach ($candidate in $candidates | Select-Object -Unique) {
                            if ($candidate -and (Test-Path $candidate)) {
                              return $candidate
                            }
                          }
                        }
                        return $null
                      }

                      # Log server information
                      Write-Host "========================================="
                      Write-Host "Deploying to Server: $env:COMPUTERNAME"
                      Write-Host "Server IP Addresses:"
                      Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -ne '127.0.0.1' } | ForEach-Object {
                        Write-Host "  - $($_.IPAddress) ($($_.InterfaceAlias))"
                      }
                      Write-Host "Agent Name: $env:AGENT_NAME"
                      Write-Host "========================================="
                      
                      # Ensure deployment directory exists
                      if (-not (Test-Path "$(DEPLOY_PATH)")) {
                        Write-Host "Deployment directory does not exist."
                        Write-Host "Please manually create C:\inetpub\wwwroot\PPApp and clone the repository:"
                        Write-Host "  mkdir C:\inetpub\wwwroot\PPApp"
                        Write-Host "  git clone --branch staging-release $(Build.Repository.Uri) C:\inetpub\wwwroot\PPApp"
                        Write-Error "Deployment directory not found. Manual setup required."
                        exit 1
                      }
                      
                      cd "$(DEPLOY_PATH)"
                      
                      # Use service account's PM2_HOME for consistent process management
                      $pm2Home = "C:\Users\SVC-PARENTPORTAL\.pm2"
                      if (-not (Test-Path $pm2Home)) {
                        New-Item -Path $pm2Home -ItemType Directory -Force | Out-Null
                      }
                      $env:PM2_HOME = $pm2Home
                      Write-Host "PM2 home set to $pm2Home"
                      Write-Host "Current user: $env:USERNAME"

                      Write-Host "Pulling latest from staging-release..."
                      git fetch origin
                      git reset --hard origin/staging-release
                      git clean -fd
                      
                      Write-Host "Copying environment files..."
                      if (Test-Path ".env.test") {
                        Copy-Item ".env.test" ".env.production" -Force
                        Copy-Item ".env.test" ".env.local" -Force
                        Copy-Item ".env.test" ".env" -Force
                        Write-Host "Environment files copied (.env.production, .env.local, .env)"
                      } else {
                        Write-Warning ".env.test not found - ensure it exists in the repository"
                      }
                      
                      Write-Host "Stopping PM2 processes to release file locks..."
                      $pm2Cmd = Get-Pm2Command
                      if ($pm2Cmd) {
                        try {
                          & $pm2Cmd stop ecosystem.config.js 2>$null
                          & $pm2Cmd delete ecosystem.config.js 2>$null
                        } catch {
                          Write-Host "PM2 stop/delete failed or app not running"
                        }
                      } else {
                        Write-Host "PM2 not available; skipping stop/delete"
                      }
                      Get-Process node -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
                      Start-Sleep -Seconds 1
                      
                      Write-Host "Cleaning node_modules..."
                      if (Test-Path "node_modules") {
                        cmd /c rmdir /s /q node_modules 2>$null
                        Start-Sleep -Seconds 2
                      }
                      
                      Write-Host "Installing dependencies..."
                      npm ci
                      if ($LASTEXITCODE -ne 0) {
                        Write-Host "npm ci failed; retrying once after cleaning npm cache..."
                        npm cache clean --force
                        npm ci
                        if ($LASTEXITCODE -ne 0) {
                          Write-Error "npm ci failed after retry. Aborting deployment."
                          exit 1
                        }
                      }
                      
                      Write-Host "Generating Prisma clients..."
                      npm run prisma:gen:all
                      if ($LASTEXITCODE -ne 0) {
                        Write-Error "Prisma client generation failed."
                        exit 1
                      }
                      
                      Write-Host "Building application..."
                      npm run build
                      if ($LASTEXITCODE -ne 0) {
                        Write-Error "Next.js build failed."
                        exit 1
                      }
                      
                      Write-Host "Verifying build output..."
                      if (-not (Test-Path ".next")) {
                        Write-Error ".next build directory not found after build."
                        exit 1
                      }
                      if (-not (Test-Path "node_modules\next\dist\bin\next")) {
                        Write-Error "Next.js binary not found in node_modules."
                        exit 1
                      }
                      Write-Host "Build verification successful."
                      
                      Write-Host "Ensuring PM2 is installed..."
                      $pm2Cmd = Get-Pm2Command
                      if (-not $pm2Cmd) {
                        Write-Host "Installing PM2 globally..."
                        npm install -g pm2
                        $pm2Cmd = Get-Pm2Command
                      }
                      if (-not $pm2Cmd) {
                        Write-Error "Unable to locate pm2 executable even after installation."
                        exit 1
                      }

                      Write-Host "Managing PM2 process using ecosystem.config.js..."
                      
                      # Always delete old processes and start fresh to ensure clean state
                      Write-Host "Cleaning up any existing PM2 processes..."
                      & $pm2Cmd delete all 2>$null
                      $LASTEXITCODE = 0  # Ignore exit code from delete
                      
                      Write-Host "Starting PM2 process from ecosystem config..."
                      & $pm2Cmd start ecosystem.config.js --env production
                      if ($LASTEXITCODE -ne 0) {
                        Write-Error "Failed to start PM2 process."
                        exit 1
                      }
                      
                      Write-Host "Saving PM2 process list for auto-resurrection..."
                      & $pm2Cmd save --force
                      if ($LASTEXITCODE -ne 0) {
                        Write-Warning "PM2 save failed, but continuing..."
                      }
                      
                      Write-Host "Setting PM2 to startup on system boot..."
                      & $pm2Cmd startup 2>$null
                      $LASTEXITCODE = 0  # Ignore exit code from startup
                      
                      Write-Host "Current PM2 status:"
                      & $pm2Cmd status
                      
                      Write-Host ""
                      Write-Host "PM2 Management Info:"
                      Write-Host "  PM2_HOME: $pm2Home"
                      Write-Host "  To check status later, run: `$env:PM2_HOME = '$pm2Home'; pm2 status"
                      Write-Host "  Saved process list: $pm2Home\dump.pm2"

                      Write-Host "Deployment complete!"
