trigger:
  branches:
    include:
      - staging-release

pool:
  name: 'Default'
  demands:
    - agent.os -equals Windows_NT

variables:
  NODE_VERSION: '20.x'
  DEPLOY_PATH: 'C:\inetpub\wwwroot\PPApp'
  APP_NAME: 'PPApp-staging'

stages:
  - stage: DeployServer1
    displayName: 'Deploy to Server 1'
    jobs:
      - deployment: DeployServer1
        displayName: 'Deploy to Server 1'
        environment: 'Staging-Server-1'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  clean: false
                  fetchDepth: 1

                - task: PowerShell@2
                  displayName: 'Pull latest from staging-release & rebuild'
                  inputs:
                    targetType: 'inline'
                    script: |
                      cd "$(DEPLOY_PATH)"
                      
                      Write-Host "Pulling latest from staging-release..."
                      git fetch origin
                      git checkout staging-release
                      git pull origin staging-release
                      
                      Write-Host "Installing dependencies..."
                      npm ci
                      
                      Write-Host "Generating Prisma clients..."
                      npm run prisma:gen:all
                      
                      Write-Host "Building application..."
                      npm run build
                      
                      Write-Host "Restarting PM2..."
                      try {
                        pm2 restart "$(APP_NAME)"
                        Write-Host "Restarted existing PM2 process"
                      } catch {
                        Write-Host "Starting new PM2 process..."
                        pm2 start npm --name "$(APP_NAME)" -- start
                      }
                      pm2 save --force
                      
                      Write-Host "Deployment complete!"
                      pm2 list

  - stage: DeployServer2
    displayName: 'Deploy to Server 2'
    dependsOn: DeployServer1
    jobs:
      - deployment: DeployServer2
        displayName: 'Deploy to Server 2'
        environment: 'Staging-Server-2'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  clean: false
                  fetchDepth: 1

                - task: PowerShell@2
                  displayName: 'Pull latest from staging-release & rebuild'
                  inputs:
                    targetType: 'inline'
                    script: |
                      cd "$(DEPLOY_PATH)"
                      
                      Write-Host "Pulling latest from staging-release..."
                      git fetch origin
                      git checkout staging-release
                      git pull origin staging-release
                      
                      Write-Host "Installing dependencies..."
                      npm ci
                      
                      Write-Host "Generating Prisma clients..."
                      npm run prisma:gen:all
                      
                      Write-Host "Building application..."
                      npm run build
                      
                      Write-Host "Restarting PM2..."
                      try {
                        pm2 restart "$(APP_NAME)"
                        Write-Host "Restarted existing PM2 process"
                      } catch {
                        Write-Host "Starting new PM2 process..."
                        pm2 start npm --name "$(APP_NAME)" -- start
                      }
                      pm2 save --force
                      
                      Write-Host "Deployment complete!"
                      pm2 list
